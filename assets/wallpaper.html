<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: O; src: url("fonts/Oswald.ttf"); font-weight: 200 700; }
*{margin:0;padding:0;box-sizing:border-box}
body{width:1440px;height:2560px;overflow:hidden;position:relative;
background:radial-gradient(70% 45% at 85% 8%,#7a0f1f 0%,transparent 60%),
radial-gradient(60% 40% at 10% 92%,#0b2a7a 0%,transparent 60%),
linear-gradient(180deg,#0a0b12 0%,#0d0f1a 50%,#07080d 100%)}
.pitch{position:absolute;inset:140px 120px;border:6px solid rgba(255,255,255,.05);border-radius:24px}
.mid{position:absolute;left:120px;right:120px;top:50%;border-top:6px solid rgba(255,255,255,.05)}
.circle{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;border:6px solid rgba(255,255,255,.05)}
.box{position:absolute;left:50%;width:760px;height:300px;margin-left:-380px;border:6px solid rgba(255,255,255,.05)}
.box.t{top:140px;border-top:none}.box.b{bottom:140px;border-bottom:none}
.slash{position:absolute;width:160px;height:3400px;top:-400px;transform:rotate(28deg);
background:linear-gradient(180deg,transparent,rgba(255,255,255,.035),transparent)}
.wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);text-align:center;
font-family:O;color:rgba(255,255,255,.045);line-height:.85}
.wm .a{font-weight:700;font-size:420px}.wm .b{font-weight:600;font-size:150px;letter-spacing:.3em}
.icons{position:absolute;inset:0;font-size:90px;opacity:.06}
.icons span{position:absolute}
</style></head><body>
<div class="slash" style="left:200px"></div><div class="slash" style="left:900px;width:60px"></div>
<div class="pitch"></div><div class="mid"></div><div class="circle"></div><div class="box t"></div><div class="box b"></div>
<div class="wm"><div class="a">INFO<br>BOT</div><div class="b">FC27</div></div>
<div class="icons">
<span style="left:200px;top:420px">🔥</span><span style="left:1100px;top:600px">🃏</span>
<span style="left:260px;top:1000px">🎯</span><span style="left:1150px;top:1250px">🧩</span>
<span style="left:180px;top:1650px">🧬</span><span style="left:1080px;top:1900px">📅</span>
<span style="left:300px;top:2200px">⚽</span><span style="left:700px;top:300px">⚽</span>
<span style="left:650px;top:2300px">🏆</span>
</div></body></html>
