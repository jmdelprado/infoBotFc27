[project]
name = "infobot"
version = "0.1.0"
description = "Bot que resume en Telegram las novedades de EA SPORTS FC 27 publicadas en X"
requires-python = ">=3.12"
dependencies = [
    "twscrape==0.20.1",
    "playwright==1.64.1",
    "httpx>=0.28,<1",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = ["pytest>=9.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infobot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
